<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Picker</title>
<style>
  :root {
    --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --card: #ffffff;
    --line: #d9d9d4; --accent: #2a62d6; --badge: #b85c00; --badge-bg: #fff0dc;
    --bad: #b3261e; --ok: #2b7a3d; --shade: rgba(0, 0, 0, .88);
    --h: 256px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --fg: #e9e9e4; --muted: #9a9a93; --card: #20201e;
      --line: #3a3a36; --accent: #6f9bff; --badge: #ffb35c; --badge-bg: #3b2a14;
      --bad: #ff8a80; --ok: #7fd68f; --shade: rgba(0, 0, 0, .92);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header { padding: 20px 16px 4px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .intro { margin: 0; color: var(--muted); white-space: pre-wrap; max-width: 80ch; }
  .ref { margin: 4px 0 0; color: var(--muted); font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
  main { padding: 0 16px 40px; }
  .row { margin: 18px 0; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  .row[hidden] { display: none; }
  .row-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .row-head h2 { margin: 0; font-size: 17px; }
  .row-id { color: var(--muted); font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
  .badge { font-size: 12px; font-weight: 600; color: var(--badge); background: var(--badge-bg); padding: 1px 8px; border-radius: 10px; }
  .badge[hidden] { display: none; }
  .row-note { margin: 4px 0 0; color: var(--muted); white-space: pre-wrap; }
  .tiles { display: flex; flex-wrap: wrap; gap: 12px; margin: 10px 0; }
  .tile {
    position: relative; margin: 0; padding: 4px; border-radius: 6px; cursor: pointer;
    outline: 3px solid transparent; outline-offset: 0;
  }
  /* The selection shows only outside the image (outline, caption): images are never
     dimmed, filtered, tinted or overlaid, so the art looks exactly as it will in use. */
  .tile:focus-visible { outline-color: var(--muted); }
  .tile.sel { outline-color: var(--accent); }
  .tile img {
    display: block; height: var(--h); width: auto; min-width: calc(var(--h) * .5);
    max-width: calc(100vw - 72px); object-fit: contain; background: var(--line); border-radius: 3px;
  }
  .tile figcaption { margin-top: 4px; font-size: 13px; text-align: center; max-width: calc(var(--h) * 1.5); margin-left: auto; margin-right: auto; }
  .tile .key { font-family: ui-monospace, Consolas, monospace; }
  .tile .check { display: none; }
  .tile.sel figcaption { color: var(--accent); }
  .tile.sel .key { font-weight: 700; }
  .tile.sel .check { display: inline; font-weight: 700; }
  .mag {
    position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border: 0; border-radius: 50%;
    background: rgba(0, 0, 0, .55); color: #fff; font-size: 16px; line-height: 30px; padding: 0; cursor: zoom-in;
  }
  .mag:hover { background: rgba(0, 0, 0, .8); }
  textarea {
    display: block; width: 100%; min-height: 2.6em; resize: vertical; font: inherit; color: inherit;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
  }
  .bar {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line);
  }
  .bar .counts { font-weight: 600; }
  .bar label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .bar input[type=range] { width: 140px; }
  .bar .grow { flex: 1; }
  .status { color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--bad); }
  button.save {
    font: inherit; font-weight: 600; padding: 6px 18px; border: 0; border-radius: 6px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.save:disabled { opacity: .5; cursor: default; }
  .empty, .fatal { margin: 24px 0; color: var(--muted); }
  .fatal { color: var(--bad); }
  .overlay {
    position: fixed; inset: 0; z-index: 10; background: var(--shade); display: flex;
    flex-direction: column; align-items: center; justify-content: center; padding: 12px;
  }
  .overlay[hidden] { display: none; }
  .overlay img { max-width: 100%; max-height: calc(100vh - 80px); object-fit: contain; }
  .overlay img.sel { outline: 3px solid var(--accent); }
  .ov-cap { margin-top: 10px; color: #eee; font-size: 14px; text-align: center; }
  .ov-cap .hint { color: #aaa; margin-left: 12px; }
  .ov-nav {
    position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; border: 0;
    background: rgba(255, 255, 255, .12); color: #fff; font-size: 26px; cursor: pointer; border-radius: 6px;
  }
  .ov-nav:hover { background: rgba(255, 255, 255, .25); }
  .ov-prev { left: 12px; }
  .ov-next { right: 12px; }
  .ov-close { position: absolute; top: 10px; right: 14px; border: 0; background: none; color: #fff; font-size: 28px; cursor: pointer; }
</style>
</head>
<body>
<div class="bar">
  <span class="counts" id="counts">loading…</span>
  <label><input type="checkbox" id="only-changed"> show changed only</label>
  <label>size <input type="range" id="size" min="128" max="640" step="16" value="256"></label>
  <span class="grow"></span>
  <span class="status" id="status"></span>
  <button class="save" id="save" disabled>Save</button>
</div>
<header>
  <h1 id="title"></h1>
  <p class="intro" id="intro" hidden></p>
  <p class="ref" id="ref"></p>
</header>
<main id="rows"></main>
<div class="overlay" id="overlay" hidden>
  <button class="ov-close" id="ov-close" title="Close (Esc)">×</button>
  <button class="ov-nav ov-prev" id="ov-prev" title="Previous (←)">‹</button>
  <img id="ov-img" alt="">
  <button class="ov-nav ov-next" id="ov-next" title="Next (→)">›</button>
  <div class="ov-cap" id="ov-cap"></div>
</div>
<script>
(function () {
  "use strict";
  var SIZE_KEY = "conductor.picker.size";
  var GONE = "the server is gone (daemon restarted?) — send pick: again; this tab keeps your choices";
  var rows = [];        // [{id, label, note, options, pick, text, el:{...}}]
  var savedState = "";  // serialized choices as last saved (or as loaded)
  var saving = false;
  var view = null;      // overlay: {row, index}

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = String(text);
    return e;
  }

  // Size slider, remembered per browser.
  function setSize(px) {
    px = Math.max(128, Math.min(640, Number(px) || 256));
    document.documentElement.style.setProperty("--h", px + "px");
    $("size").value = String(px);
    return px;
  }
  var stored = null;
  try { stored = window.localStorage.getItem(SIZE_KEY); } catch (e) { stored = null; }
  setSize(stored || 256);
  $("size").addEventListener("input", function () {
    var px = setSize(this.value);
    try { window.localStorage.setItem(SIZE_KEY, String(px)); } catch (e) { /* storage blocked */ }
  });

  // A many row ("kind": "many") keeps any number of its options: `kept[i]` per option.
  function keptKeys(r) {
    return r.options.filter(function (o, i) { return r.kept[i]; }).map(function (o) { return o.key; });
  }
  function payload() {
    return rows.map(function (r) {
      return r.many ? { id: r.id, keys: keptKeys(r), note: r.text }
                    : { id: r.id, key: r.options[r.pick].key, note: r.text };
    });
  }
  function serialized() { return JSON.stringify(payload()); }
  function dirty() { return rows.length > 0 && serialized() !== savedState; }
  function isChanged(r) { return r.many ? keptKeys(r).join(" ") !== r.dflt.join(" ") : r.pick !== 0; }
  function isSel(r, i) { return r.many ? r.kept[i] : r.pick === i; }

  function setStatus(text, kind) {
    var s = $("status");
    s.textContent = text;
    s.className = "status" + (kind ? " " + kind : "");
  }

  function refresh() {
    var changed = 0, notes = 0, only = $("only-changed").checked;
    rows.forEach(function (r) {
      var c = isChanged(r);
      if (c) changed++;
      if (r.text.trim()) notes++;
      r.el.badge.hidden = !c;
      r.el.row.hidden = only && !c;
    });
    $("counts").textContent = changed + " of " + rows.length + " changed · " +
      notes + (notes === 1 ? " note" : " notes");
    $("save").disabled = saving || rows.length === 0;
    var st = $("status");
    if (!saving && st.className.indexOf("bad") < 0) {
      if (dirty()) setStatus("unsaved changes", "");
      else if (st.textContent === "unsaved changes") setStatus("", "");
    }
  }

  function select(r, index) {
    if (r.many) r.kept[index] = !r.kept[index];     // a many row toggles keep / drop
    else r.pick = index;
    r.el.tiles.forEach(function (t, i) { t.classList.toggle("sel", isSel(r, i)); });
    if (r.many) r.el.count.textContent = keptKeys(r).length + " of " + r.options.length + " kept";
    if ($("status").textContent.indexOf("Saved") === 0) setStatus("", "");
    refresh();
  }

  // Overlay: full size, Left/Right step the row's options, Enter picks, Esc closes.
  function showView() {
    var r = view.row, o = r.options[view.index];
    var img = $("ov-img");
    img.src = o.src;
    img.alt = o.label || o.key;
    img.classList.toggle("sel", isSel(r, view.index));
    var cap = $("ov-cap");
    cap.textContent = "";
    cap.appendChild(el("span", null, r.label + " — "));
    cap.appendChild(el("b", null, o.key));
    if (o.label) cap.appendChild(el("span", null, " · " + o.label));
    cap.appendChild(el("span", null, "  (" + (view.index + 1) + "/" + r.options.length + ")" +
      (r.many ? (isSel(r, view.index) ? " ✓ kept" : " dropped") : view.index === r.pick ? " ✓ picked" : "")));
    cap.appendChild(el("span", "hint", "←/→ step · Enter " + (r.many ? "keeps / drops" : "picks") + " · Esc closes"));
  }
  function openView(r, index) {
    view = { row: r, index: index };
    $("overlay").hidden = false;
    showView();
    $("ov-close").focus({ preventScroll: true });   // keys go to the overlay, not a note behind it
  }
  function closeView() {
    if (!view) return;
    var tile = view.row.el.tiles[view.index];
    view = null;
    $("overlay").hidden = true;
    $("ov-img").removeAttribute("src");
    if (tile) tile.focus({ preventScroll: true });
  }
  function step(d) {
    var n = view.row.options.length;
    view.index = (view.index + d + n) % n;
    showView();
  }
  $("ov-prev").addEventListener("click", function (e) { e.stopPropagation(); step(-1); });
  $("ov-next").addEventListener("click", function (e) { e.stopPropagation(); step(1); });
  $("ov-close").addEventListener("click", function (e) { e.stopPropagation(); closeView(); });
  $("ov-img").addEventListener("click", function (e) { e.stopPropagation(); });
  $("overlay").addEventListener("click", closeView);

  document.addEventListener("keydown", function (e) {
    if (view) {
      // Focus stays in the overlay: Tab never reaches a tile or note behind it.
      var behind = e.target !== document.body && !$("overlay").contains(e.target);
      if (behind || e.key === "Tab") {
        e.preventDefault();
        $("ov-close").focus({ preventScroll: true });
        return;
      }
      if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
      else if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
      else if (e.key === "Enter") {
        select(view.row, view.index);
        if (view.row.many) showView(); else closeView();     // keep / drop several without leaving
        e.preventDefault();
      }
      else if (e.key === "Escape") { closeView(); e.preventDefault(); }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) { e.preventDefault(); save(); }
  });

  function buildRow(r) {
    var row = el("section", "row");
    var head = el("div", "row-head");
    head.appendChild(el("h2", null, r.label || r.id));
    if (r.label && r.label !== r.id) head.appendChild(el("span", "row-id", r.id));
    var badge = el("span", "badge", "changed");
    head.appendChild(badge);
    var count = el("span", "row-id", r.many ? keptKeys(r).length + " of " + r.options.length + " kept" : "");
    if (r.many) head.appendChild(count);
    row.appendChild(head);
    if (r.many) row.appendChild(el("p", "row-note", "Keep any number: click a tile to keep or drop it."));
    if (r.note) row.appendChild(el("p", "row-note", r.note));

    var line = el("div", "tiles");
    var tiles = r.options.map(function (o, i) {
      var t = el("figure", "tile");
      t.tabIndex = 0;
      t.setAttribute("role", "button");
      var img = el("img");
      img.loading = "lazy";
      img.decoding = "async";
      img.alt = o.label || o.key;
      img.src = o.src;
      t.appendChild(img);
      var cap = el("figcaption");
      cap.appendChild(el("span", "check", r.many ? "✓ keep " : "✓ "));
      cap.appendChild(el("span", "key", o.key));
      if (o.label) cap.appendChild(el("span", null, " · " + o.label));
      t.appendChild(cap);
      var mag = el("button", "mag", "⌕");
      mag.type = "button";
      mag.title = "Full size";
      mag.addEventListener("click", function (e) { e.stopPropagation(); openView(r, i); });
      t.appendChild(mag);
      // A one row: click picks, clicking the pick opens it. A many row: click toggles (⌕ opens).
      function act() { if (!r.many && r.pick === i) openView(r, i); else select(r, i); }
      t.addEventListener("click", act);
      t.addEventListener("keydown", function (e) {
        if (e.target !== t || view) return;
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          e.stopPropagation();  // else the document handler sees the new overlay and picks
          act();
        }
      });
      line.appendChild(t);
      return t;
    });
    row.appendChild(line);

    var ta = el("textarea");
    ta.placeholder = "note (e.g. none of these, hair still too orange)";
    ta.value = r.text;
    ta.addEventListener("input", function () {
      r.text = ta.value;
      if ($("status").textContent.indexOf("Saved") === 0) setStatus("", "");
      refresh();
    });
    row.appendChild(ta);

    r.el = { row: row, badge: badge, tiles: tiles, count: count };
    tiles.forEach(function (t, i) { if (isSel(r, i)) t.classList.add("sel"); });
    return row;
  }

  function load(m) {
    document.title = m.title || m.name || "Picker";
    $("title").textContent = m.title || m.name || "Picker";
    if (m.intro) { $("intro").textContent = m.intro; $("intro").hidden = false; }
    $("ref").textContent = (m.ref || "") + (m.name ? "  ·  " + m.name : "");

    var saved = {};
    if (m.saved && Array.isArray(m.saved.rows)) {
      m.saved.rows.forEach(function (s) { if (s && s.id != null) saved[s.id] = s; });
    }
    var main = $("rows");
    main.textContent = "";
    rows = (m.rows || []).filter(function (r) {
      return r && Array.isArray(r.options) && r.options.length > 0;
    }).map(function (r) {
      var s = saved[r.id], pick = 0, text = "", many = !!r.many;
      var dflt = Array.isArray(r["default"]) ? r["default"] : [];
      var keep = s && Array.isArray(s.keys) ? s.keys : dflt;
      if (s && !many) {
        for (var i = 0; i < r.options.length; i++) {
          if (r.options[i].key === s.key) { pick = i; break; }
        }
      }
      if (s) text = typeof s.note === "string" ? s.note : "";
      return { id: r.id, label: r.label || "", note: r.note || "", options: r.options, pick: pick, text: text,
               many: many, dflt: dflt,
               kept: r.options.map(function (o) { return keep.indexOf(o.key) >= 0; }) };
    });
    // Baseline for the dirty flag, in manifest row order. A saved choice whose
    // key is gone fell back to the first option above, so that row starts dirty;
    // a row the saved file lacks counts as its first option (a many row: its default) with no note.
    savedState = JSON.stringify(rows.map(function (r) {
      var s = saved[r.id], note = s && typeof s.note === "string" ? s.note : "";
      if (r.many) return { id: r.id, keys: s && Array.isArray(s.keys) ? s.keys : r.dflt, note: note };
      return s ? { id: r.id, key: s.key, note: note } : { id: r.id, key: r.options[0].key, note: "" };
    }));
    if (!rows.length) main.appendChild(el("p", "empty", "This manifest has no rows."));
    rows.forEach(function (r) { main.appendChild(buildRow(r)); });
    if (m.saved && m.saved.saved_at) setStatus("last saved " + (m.saved.clock || m.saved.saved_at), "");
    refresh();
  }

  function save() {
    if (saving || !rows.length) return;
    saving = true;
    var body = serialized();
    setStatus("saving…", "");
    refresh();
    fetch("save", { method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ rows: payload() }) })
      .then(function (res) {
        return res.text().then(function (text) {
          var data = null;
          try { data = JSON.parse(text); } catch (e) { data = null; }
          if (res.ok && data) {
            savedState = body;
            setStatus("Saved " + (data.clock || ""), "ok");
          } else if (res.status === 404) {
            setStatus("Save failed: " + GONE, "bad");
          } else {
            var why = (data && data.error) || text.trim() || ("HTTP " + res.status);
            setStatus("Save failed: " + why, "bad");
          }
        });
      }, function () {
        setStatus("Save failed: " + GONE, "bad");
      })
      .then(function () { saving = false; refresh(); });
  }
  $("save").addEventListener("click", save);
  $("only-changed").addEventListener("change", refresh);

  window.addEventListener("beforeunload", function (e) {
    if (!dirty()) return;
    e.preventDefault();
    e.returnValue = "";
    return "";
  });

  fetch("manifest.json", { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error(res.status === 404 ? GONE : "HTTP " + res.status);
      return res.json();
    })
    .then(load)
    .catch(function (err) {
      $("counts").textContent = "";
      var p = el("p", "fatal", "Could not load the picker: " + (err && err.message ? err.message : err));
      $("rows").textContent = "";
      $("rows").appendChild(p);
    });
})();
</script>
</body>
</html>
