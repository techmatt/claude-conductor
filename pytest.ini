[pytest]
testpaths = tests
# The fast lane by default, in parallel. Everything: `uv run pytest -m ""`. One test: add `-n0`.
addopts = -n auto --maxprocesses 8 --dist worksteal -m "not slow"
markers =
    slow: runs several executors, merges, stages or restarts (the full lane: -m "")
# A passing test's folder goes at its own teardown, on its worker: left for the end of a
# later session, three runs' worth cost 12-16s of one process's unlinks on Windows.
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
